      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#ledgerGrad)"/>
  <rect x="76" y="86" width="360" height="340" rx="36" fill="#FBF8F1" stroke="#E7E1D3" stroke-width="8"/>
